<style>
  /* ===== KAIMONO SIDEBAR — UNIFIED (single source of truth) ===== */
  #sidebar {
    width: 5rem;
    padding: 1.5rem 0.625rem;
    box-shadow: 0 1px 2px rgba(15,23,42,0.05);
    transition: width 300ms cubic-bezier(0.4,0,0.2,1), padding 300ms cubic-bezier(0.4,0,0.2,1), box-shadow 300ms ease;
  }
  #sidebar.expanded { width: 16rem; padding: 1.5rem 1rem; box-shadow: 0 18px 44px -18px rgba(50,52,70,0.22); }
  #sidebar .nav-item {
    display: flex; align-items: center; justify-content: center; gap: 0;
    padding: 0.75rem 0; width: 100%; color: #64748b; font-weight: 600;
    border-radius: 1rem; text-align: left;
    transition: gap 300ms cubic-bezier(0.4,0,0.2,1), padding 300ms cubic-bezier(0.4,0,0.2,1), background-color 200ms, color 200ms;
  }
  #sidebar.expanded .nav-item { justify-content: flex-start; gap: 0.875rem; padding: 0.75rem 0.875rem; }
  #sidebar .nav-item:hover { background: rgba(226,232,240,0.5); color: #0f172a; }
  #sidebar .nav-active, #sidebar .nav-active:hover {
    background: rgba(226,232,240,0.8); color: #0f172a; font-weight: 700;
    box-shadow: 0 1px 2px rgba(15,23,42,0.08);
  }
  #sidebar .nav-profile { padding-bottom: 0.75rem; border-bottom: 1px solid rgba(226,232,240,0.8); }
  #sidebar .sidebar-text {
    display: block; max-width: 0; opacity: 0; overflow: hidden; white-space: nowrap;
    transform: translateX(-6px);
    transition: max-width 300ms cubic-bezier(0.4,0,0.2,1), opacity 160ms ease, transform 160ms ease;
  }
  #sidebar.expanded .sidebar-text {
    max-width: 12rem; opacity: 1; transform: translateX(0);
    transition: max-width 300ms cubic-bezier(0.4,0,0.2,1), opacity 220ms ease 90ms, transform 220ms ease 90ms;
  }
  #sidebar.expanded .sidebar-text.fill { flex: 1 1 auto; }
</style>

<aside id="sidebar" class="shrink-0 h-full bg-[#F7F9FC] text-slate-700 rounded-[2rem] border border-white flex flex-col justify-between overflow-hidden">
  <div class="flex flex-col gap-5 w-full flex-1 min-h-0">
    <a href="/profile/" data-path="/profile/" class="nav-item nav-profile">
      <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=150&q=80" alt="Avatar" class="w-10 h-10 rounded-full border-2 border-slate-300 object-cover shadow-sm shrink-0">
      <span class="sidebar-text">
        <span class="block font-bold text-slate-800 truncate text-xs">Hoshino Ichika</span>
        <span class="block text-[10px] text-slate-400 font-medium truncate">Premium Member</span>
      </span>
    </a>
    <nav class="flex flex-col gap-1.5 w-full overflow-y-auto min-h-0">
      <a href="/dashboard/" data-path="/dashboard/" class="nav-item">
        <i data-lucide="home" class="w-5 h-5 shrink-0"></i>
        <span class="sidebar-text text-xs">Dashboard</span>
      </a>
      <a href="/community/" data-path="/community/" class="nav-item">
        <i data-lucide="users" class="w-5 h-5 shrink-0"></i>
        <span class="sidebar-text text-xs">Community</span>
      </a>
      <a href="/wishlist/" data-path="/wishlist/" class="nav-item">
        <i data-lucide="heart" class="w-5 h-5 shrink-0"></i>
        <span class="sidebar-text fill text-xs">Wishlist</span>
        <span class="sidebar-text text-[10px] font-bold bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full">12</span>
      </a>
      <a href="/library/" data-path="/library/" class="nav-item">
        <i data-lucide="inbox" class="w-5 h-5 shrink-0"></i>
        <span class="sidebar-text text-xs">Library</span>
      </a>
      <a href="/settings/" data-path="/settings/" class="nav-item">
        <i data-lucide="settings" class="w-5 h-5 shrink-0"></i>
        <span class="sidebar-text text-xs">Settings</span>
      </a>
    </nav>
  </div>
  <div class="flex flex-col gap-1.5 w-full pt-4 border-t border-slate-200/80">
    <button id="toggle-sidebar" class="nav-item">
      <span id="toggle-icon-holder" class="flex items-center justify-center w-5 h-5 shrink-0">
        <i data-lucide="panel-left-open" class="w-5 h-5 shrink-0"></i>
      </span>
      <span id="collapse-label" class="sidebar-text text-xs">Expand</span>
    </button>
    <a href="/" class="nav-item">
      <i data-lucide="log-out" class="w-5 h-5 shrink-0"></i>
      <span class="sidebar-text text-xs">Log Out</span>
    </a>
  </div>
</aside>

<script>
(function () {
  var sidebar = document.getElementById('sidebar');
  if (!sidebar) return;
  var toggleBtn  = document.getElementById('toggle-sidebar');
  var iconHolder = document.getElementById('toggle-icon-holder');
  var label      = document.getElementById('collapse-label');
  var isCollapsed = localStorage.getItem('kaimono_sidebar_collapsed') !== 'false';

  // Active link otomatis dari URL — markup identik di semua page
  var path = window.location.pathname;
  sidebar.querySelectorAll('[data-path]').forEach(function (a) {
    var p = a.getAttribute('data-path');
    if (p && path.indexOf(p) === 0) a.classList.add('nav-active');
  });

  function render() {
    sidebar.classList.toggle('expanded', !isCollapsed);
    if (iconHolder) iconHolder.innerHTML = '<i data-lucide="' + (isCollapsed ? 'panel-left-open' : 'panel-left-close') + '" class="w-5 h-5 shrink-0"></i>';
    if (label) label.textContent = isCollapsed ? 'Expand' : 'Collapse';
    if (window.lucide) lucide.createIcons();
  }
  render();

  if (toggleBtn) toggleBtn.addEventListener('click', function () {
    isCollapsed = !isCollapsed;
    localStorage.setItem('kaimono_sidebar_collapsed', String(isCollapsed));
    render();
  });
})();
</script>
