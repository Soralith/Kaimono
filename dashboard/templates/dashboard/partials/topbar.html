<div class="pt-5 pb-3 px-6 relative w-full shrink-0">
  <header class="bg-[#323446] text-slate-300 px-6 py-4 flex justify-between items-center shadow-md rounded-xl border border-slate-700/60">
    <div class="flex items-center gap-6">
      <div class="flex items-center gap-2">
        <i data-lucide="user" class="w-4 h-4 text-white"></i>
        <span class="font-bold text-white tracking-widest uppercase text-sm">@{{ request.user.username|default:'guest' }}</span>
      </div>
      <div class="px-3 py-1 text-slate-300 font-serif italic text-sm tracking-wider opacity-90">LazyStudio</div>
      <span class="text-slate-500">|</span>
      <div class="flex items-center gap-3 text-slate-400 tracking-wider">
        <span class="text-xs bg-slate-800/80 px-3 py-1 rounded text-slate-300 font-mono">CURRENT PROJECT</span>
        <span class="text-slate-500">|</span>
        <span class="font-semibold text-slate-200 text-sm">ANIME MERCH E-COMMERCE DASHBOARD</span>
        <span class="text-slate-500">//</span>
        <span class="text-slate-300 text-xs">PROJECT SEKAI STYLE</span>
      </div>
    </div>
    <div class="flex items-center gap-6">
      <div class="flex items-center gap-0 opacity-70">
        <div class="w-48 bg-slate-500/50 h-[2px] rounded-l-full relative">
          <div class="absolute right-0 -top-1 w-2.5 h-3 bg-white shadow-sm"></div>
        </div>
        <i data-lucide="play" class="w-3.5 h-3.5 text-white fill-white rotate-180 -ml-1"></i>
      </div>
      <div class="flex items-center gap-4 pl-4">
        <span class="font-bold text-white tracking-widest text-sm">{{ request.user.display_name|default:request.user.username|upper }}</span>
        <button class="p-1 transition-colors text-white"><i data-lucide="list" class="w-5 h-5"></i></button>
      </div>
    </div>
  </header>
</div>
